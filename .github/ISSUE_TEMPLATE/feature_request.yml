name: Feature
description: New functionality for users
title: "feat: "
labels: ["enhancement"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - infra
        - frontend
        - analyzer-service
        - ci/cd
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What need or problem does this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How do we know it's done?
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true
