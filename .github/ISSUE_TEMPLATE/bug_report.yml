name: Bug report
description: Something is broken or behaving unexpectedly
title: "fix: "
labels: ["bug"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - infra
        - frontend
        - analyzer-service
        - ci/cd
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - local
        - dev
        - prod
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened?
      description: Include error messages, logs or screenshots.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run ...
        2. Open ...
        3. See error
