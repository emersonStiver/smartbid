# CodeBuild buildspec: smartbid-pr-check (infra/environments/shared/cicd-builds)
# Triggered by GitHub pull requests. Runs only the checks for the folders the PR changed,
# then CodeBuild reports pass/fail to GitHub as the "smartbid/pr-check" status (required on main).
# Runs on the smartbid-ci/tools image (terraform, tflint, checkov, node, maven, gitleaks, hadolint).
version: 0.2

env:
  shell: bash
  variables:
    TF_PLUGIN_CACHE_DIR: "/tmp/terraform-plugin-cache"

phases:
  pre_build:
    commands:
      # Compare the PR branch against the branch it will merge into (requires full clone depth on the project)
      - BASE_BRANCH="${CODEBUILD_WEBHOOK_BASE_REF#refs/heads/}"
      - git fetch --no-tags origin "${BASE_BRANCH:-main}"
      - git diff --name-only FETCH_HEAD...HEAD > /tmp/changed.txt
      - mkdir -p "$TF_PLUGIN_CACHE_DIR"
      - echo "Changed files:" && cat /tmp/changed.txt

  build:
    commands:
      - |
        set -euo pipefail
        changed() { grep -qE "$1" /tmp/changed.txt; }

        echo "===== secrets in the PR's commits"
        gitleaks git --log-opts="FETCH_HEAD..HEAD" --redact --exit-code 1 "$CODEBUILD_SRC_DIR"

        echo "===== Dockerfiles"
        grep -E '(^|/)Dockerfile$' /tmp/changed.txt | while read -r f; do
          if [ -f "$f" ]; then hadolint "$f"; fi
        done

        if changed '^infra/'; then
          echo "===== infra"
          cd "$CODEBUILD_SRC_DIR/infra"
          terraform fmt -check -recursive
          for dir in $(find environments modules -name '*.tf' -not -path '*/.terraform/*' -printf '%h\n' | sort -u); do
            echo "--- validate $dir"
            terraform -chdir="$dir" init -backend=false -input=false > /dev/null
            terraform -chdir="$dir" validate -no-color
          done
          tflint --init --config "$PWD/.tflint.hcl"
          tflint --recursive --config "$PWD/.tflint.hcl"
          checkov --directory . --framework terraform --quiet --skip-path '\.terraform'
        fi

        if changed '^frontend/'; then
          echo "===== frontend"
          cd "$CODEBUILD_SRC_DIR/frontend"
          npm ci
          npx ng build
          npx ng test --watch=false
        fi

        if changed '^analyzer-service/'; then
          echo "===== analyzer-service"
          cd "$CODEBUILD_SRC_DIR/analyzer-service"
          mvn -B -ntp verify
        fi

cache:
  paths:
    - /root/.npm/**/*
    - /root/.m2/**/*
    - /tmp/terraform-plugin-cache/**/*
