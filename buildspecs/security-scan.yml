# CodeBuild buildspec: smartbid-security-scan — pipeline stage Validate (parallel with build-test)
# Every scanner runs even if an earlier one fails; the build fails at the end if any found a problem.
#   gitleaks  secrets in the source
#   semgrep   SAST (code patterns) for the Java service
#   trivy fs  vulnerable dependencies + misconfigurations (Dockerfiles, etc.)
#   checkov   Terraform security
# Report group: smartbid-security-scan-security-findings. Raw reports are copied to the reports bucket.
# Env: REPORTS_BUCKET (Terraform), COMMIT_ID (pipeline)
version: 0.2

env:
  shell: bash
  # SaaS scanner tokens, once cicd-foundation create_scanner_tokens_secret = true and the secret has a value:
  # secrets-manager:
  #   SEMGREP_APP_TOKEN: "smartbid/ci/scanner-tokens:SEMGREP_APP_TOKEN"

phases:
  pre_build:
    commands:
      # Put every dependency POM in ~/.m2 first: trivy reads them locally instead of asking Maven Central,
      # which rate-limits shared CI IP addresses (trivy fails with "repository blocks ... requests from this IP")
      # (subshell: the working directory stays at the repo root even if mvn fails)
      - (cd analyzer-service && mvn -B -ntp -q dependency:resolve)

  build:
    commands:
      - |
        mkdir -p reports
        failed=0

        echo "===== gitleaks"
        gitleaks dir . --redact --exit-code 1 \
          --report-format junit --report-path reports/gitleaks.xml || failed=1

        echo "===== semgrep"
        semgrep scan --metrics=off --error --config p/java --config p/secrets \
          --junit-xml --output reports/semgrep.xml analyzer-service || failed=1

        echo "===== trivy (dependencies + misconfigurations)"
        trivy fs --scanners vuln,misconfig --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
          --ignorefile .trivyignore.yaml \
          --format template --template "@/usr/local/share/trivy/templates/junit.tpl" \
          --output reports/trivy-fs.xml . || failed=1

        echo "===== checkov (terraform)"
        checkov --directory infra --framework terraform --quiet --skip-path '\.terraform' \
          --output junitxml > reports/checkov.xml || failed=1

        exit "$failed"

  post_build:
    commands:
      - aws s3 cp reports "s3://$REPORTS_BUCKET/security-scan/${COMMIT_ID:-$CODEBUILD_BUILD_NUMBER}/" --recursive

reports:
  security-findings:
    base-directory: reports
    files:
      - "*.xml"
    file-format: JUNITXML

cache:
  paths:
    - /root/.m2/**/*
